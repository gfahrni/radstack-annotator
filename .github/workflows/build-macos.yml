name: Build macOS portable (onedir)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Install ffmpeg (brew)
        run: |
          brew install ffmpeg
          ffmpeg -version
          # copy to packaging for bundling (optional)
          cp $(which ffmpeg) packaging/macos/ffmpeg || true

      - name: Build with PyInstaller (onedir)
        run: pyinstaller packaging/macos/RadStack.spec --noconfirm

      - name: Smoke test
        run: |
          test -f dist/RadStackAnnotator/RadStackAnnotator || (echo "exe missing" && exit 1)
          ls -lh dist/RadStackAnnotator | head -n 50

      - name: Zip portable
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/RadStackAnnotator RadStackAnnotator-portable-macos.zip
          ls -lh RadStackAnnotator-portable-macos.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: RadStackAnnotator-portable-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
